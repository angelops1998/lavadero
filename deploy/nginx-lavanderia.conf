# nginx server block para LavaApp (lavandería).
# Es una web INDEPENDIENTE de las otras apps del VPS (pami, numisbol): comparten
# nginx e IP, cada una enruta a su propio puerto local.
#
# Estado actual: sin dominio propio todavía, se accede por IP:8080.
# Instalación (en el VPS, como root):
#   1) sudo cp deploy/nginx-lavanderia.conf /etc/nginx/sites-available/lavanderia
#   2) sudo ln -s /etc/nginx/sites-available/lavanderia /etc/nginx/sites-enabled/lavanderia
#   3) sudo nginx -t   (verifica sintaxis)
#   4) sudo systemctl reload nginx
#   5) sudo ufw allow 8080/tcp
#
# Si más adelante se asigna un dominio (ej. lavanderia.tudominio.com):
#   1) Reemplazar "listen 8080;" por "listen 80;" y agregar server_name <dominio>.
#   2) sudo certbot --nginx -d <dominio>  (agrega el bloque 443 y el redirect solo)
#   3) Actualizar BASE_URL en /opt/lavanderia/.env y HTTPS_ONLY=true.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/lavanderia/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
