{% extends "base.html" %}
{% block title %}Ingresar — LavaApp{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🧺</div>
            <h1>Ingresar</h1>
            <p>Acceso para el personal de la lavandería</p>
        </div>

        {% if error %}
        <div class="alert alert-error"><span class="alert-icon">⚠</span><span>{{ error }}</span></div>
        {% endif %}

        <form method="post" action="/auth/login" novalidate>
            {{ csrf_input(request) }}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" value="{{ form.usuario if form else '' }}"
                       placeholder="tu usuario" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-password">
                    <input type="password" id="password" name="password" placeholder="tu contraseña"
                           required autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="password" title="Mostrar/ocultar">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
